<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fontdone browser example</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 42rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      canvas {
        display: block;
        margin-top: 1rem;
        border: 1px solid currentColor;
        background: white;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <h1>fontdone browser example</h1>
    <p>Select a font to render “A” through the packaged WebAssembly module.</p>
    <input id="font" type="file" accept=".ttf,.otf,.ttc,.bdf,.pcf,.pfa,.pfb" />
    <p id="status" role="status">Loading fontdone…</p>
    <canvas id="glyph" width="1" height="1" aria-label="Rendered glyph A"></canvas>
    <script type="module" src="./browser.mjs"></script>
  </body>
</html>
