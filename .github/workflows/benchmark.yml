name: Benchmark
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmark.yml'
      - 'scripts/bench_freetype.py'
      - 'scripts/bench_ft_ops.c'
      - 'scripts/docs_evidence.py'
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false
env:
  RUSTC_WRAPPER: ''
  RUST_TOOLCHAIN: '1.96.1'
jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install the pinned Rust toolchain and WASM target
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
      - name: Validate the benchmark and measure the full matrix
        run: make bench-self-test bench BENCH_SAMPLES=10 BENCH_PROFILE=default PYTHON=python
      - name: Validate and export the clean source measurement
        run: make docs-benchmark DOCS_BENCHMARK_SOURCE=target/fontdone-bench/latest.json DOCS_BENCHMARK_OUTPUT=target/public-benchmark/snapshot.json PYTHON=python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-benchmark
          path: target/public-benchmark/snapshot.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-${{ github.run_id }}
          path: target/fontdone-bench/
          if-no-files-found: error
