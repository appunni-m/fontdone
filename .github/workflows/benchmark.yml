name: Benchmark
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false
env:
  RUSTC_WRAPPER: ''
  RUST_TOOLCHAIN: '1.96.1'
jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12.10'
      - name: Install the pinned Rust toolchain and WASM target
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
      - name: Validate the benchmark and measure the full matrix
        run: make bench-self-test bench BENCH_SAMPLES=10 BENCH_PROFILE=default PYTHON=python
      - name: Validate and export the clean source measurement
        run: make docs-benchmark DOCS_BENCHMARK_SOURCE=target/fontdone-bench/latest.json DOCS_BENCHMARK_OUTPUT=target/public-benchmark/snapshot.json PYTHON=python
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-benchmark
          path: target/public-benchmark/snapshot.json
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: benchmark-${{ github.run_id }}
          path: target/fontdone-bench/
          if-no-files-found: error
