name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact synchronized version, for example 2.14.3-alpha.1
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.1"

jobs:
  preflight:
    name: Verify release and successful CI
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Verify requested version
        shell: bash
        run: |
          actual="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fontdone") | .version')"
          test "$actual" = "${{ inputs.version }}"
      - name: Install pinned font-generation tools
        run: |
          python3 -m venv target/font-generation-venv
          target/font-generation-venv/bin/python -m pip install \
            --requirement requirements-font-generation.txt
      - name: Require successful CI for this commit
        id: successful-ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&event=workflow_dispatch" \
            --jq '.workflow_runs[0].id // empty')"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Assemble platform evidence from successful CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.successful-ci.outputs.run_id }}
          pattern: platform-contract-*
          path: target/api-abi-audit/platform-contract
          merge-multiple: true
      - run: make release-verify PYTHON=target/font-generation-venv/bin/python
      - name: Retain preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-preflight-${{ inputs.version }}
          path: |
            target/package/*.crate
            target/release-evidence/
          retention-days: 90

  publish:
    name: Approved crates.io publication
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish_release.py --publish
      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ inputs.version }}"
          git tag -a "v${version}" -m "fontdone ${version}"
          git push origin "v${version}"
          gh release create "v${version}" \
            --title "fontdone ${version}" \
            --notes-file target/release-evidence/release-notes.md \
            target/package/*.crate \
            target/release-evidence/SHA256SUMS
