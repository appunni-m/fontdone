# Publication is tag-driven after the first local bootstrap. The workflow
# never creates or moves a tag; it verifies the pushed tag and exact source
# revision before publishing immutable artifacts.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.96.1"
  NODE_VERSION: "22.14.0"
  NPM_VERSION: "11.5.1"

jobs:
  preflight:
    name: Verify release and successful CI
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Verify tag and synchronized versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "v${version}" = "$GITHUB_REF_NAME"
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fontdone") | .version')"
          test "$cargo_version" = "$version"
          npm_version="$(python3 -c 'import json; print(json.load(open("fontdone-wasm/npm/package.json"))["version"])')"
          test "$npm_version" = "$version"
          make check-versions
      - name: Install pinned font-generation tools
        run: |
          python3 -m venv target/font-generation-venv
          target/font-generation-venv/bin/python -m pip install \
            --requirement requirements-font-generation.txt
      - name: Locate successful thorough CI for this commit
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "workflow_dispatch")][0].id // empty')"
          test -n "$run_id"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download exact platform-contract artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci-run.outputs.run-id }}
          pattern: platform-contract-*
          path: target/api-abi-audit/platform-contract
          merge-multiple: true
      - name: Run the complete release gate
        run: make release-verify PYTHON=target/font-generation-venv/bin/python
      - name: Assemble immutable release bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-bundle
          cp "target/package/fontdone-${version}.crate" release-bundle/
          cp "target/npm-package/fontdone-${version}.tgz" release-bundle/
          cp target/release-evidence/SHA256SUMS release-bundle/
          (cd release-bundle && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fontdone-${{ github.ref_name }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 90

  publish-crates:
    name: Publish fontdone crates to crates.io
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Authenticate to crates.io with OIDC
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish synchronized crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: python3 scripts/publish_release.py --publish-if-missing

  publish-npm:
    name: Publish fontdone npm package
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fontdone-${{ github.ref_name }}
          path: release-bundle
      - name: Verify release bundle
        run: (cd release-bundle && sha256sum --check SHA256SUMS)
      - name: Publish exact npm artifact with provenance
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "fontdone@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "fontdone@${version} is already visible; keeping the immutable artifact"
          else
            npm publish "release-bundle/fontdone-${version}.tgz" \
              --access public --tag next --provenance
          fi

  github-release:
    name: Create immutable GitHub Release
    needs: [preflight, publish-crates, publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fontdone-${{ github.ref_name }}
          path: release-bundle
      - name: Verify release bundle
        run: (cd release-bundle && sha256sum --check SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            release-bundle/*.crate
            release-bundle/*.tgz
            release-bundle/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "fontdone ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release-bundle/*.crate release-bundle/*.tgz release-bundle/SHA256SUMS
