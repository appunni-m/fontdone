name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The repository's local .cargo/config.toml enables sccache, but hosted
  # runners do not provide it. Empty RUSTC_WRAPPER keeps CI self-contained;
  # local development may still use the configured compiler cache.
  RUSTC_WRAPPER: ""
  RUST_TOOLCHAIN: "1.96.1"
  RUST_MSRV: "1.87.0"
  RUST_COVERAGE_TOOLCHAIN: "nightly-2026-07-16"
  NODE_VERSION: "22.14.0"
  NPM_VERSION: "11.5.1"
  CARGO_LLVM_COV_VERSION: "0.8.7"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  commit-fast:
    name: Commit / Fast gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install fast-gate prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake clang make python3 python3-venv xz-utils
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal --component clippy,rustfmt
          rustup override set "$RUST_TOOLCHAIN"
      - name: Install pinned font-generation tools
        run: |
          python3 -m venv target/font-generation-venv
          target/font-generation-venv/bin/python -m pip install \
            --requirement requirements-font-generation.txt
      - name: Run the exact per-commit gate
        shell: bash
        run: |
          set -o pipefail
          log_file="target/ci-diagnostics/fontdone-ci-fast.log"
          mkdir -p "$(dirname "$log_file")"
          set +e
          make ci-fast PYTHON=target/font-generation-venv/bin/python 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 40 "$log_file" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=ci-fast failure::$summary"
            exit "$status"
          fi
      - name: Retain smoke diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: parity-smoke-diagnostics
          path: |
            target/api-abi-audit/
            target/ci-diagnostics/
            target/external-consumers/c/
            tests/fixtures/outputs/
          if-no-files-found: ignore
          retention-days: 7

  msrv:
    name: Commit / MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_MSRV }}-${{ hashFiles('Cargo.lock') }}
      - name: Install MSRV
        run: |
          rustup toolchain install "$RUST_MSRV" --profile minimal
          rustup override set "$RUST_MSRV"
      - name: Check the public crate on its MSRV
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_MSRV }}
        run: |
          set -o pipefail
          log_file="target/ci-diagnostics/fontdone-msrv.log"
          mkdir -p "$(dirname "$log_file")"
          set +e
          make test-msrv 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 40 "$log_file" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=public MSRV failure::$summary"
            exit "$status"
          fi
      - name: Retain MSRV diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: msrv-diagnostics
          path: target/ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  portable-abi:
    name: Commit / Portable C ABI types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Install fixed toolchain and foreign targets
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          make setup-platform-checks
      - name: Check 32-bit long, Windows LLP64, and unsigned-char PowerPC
        run: |
          for target in i686-unknown-linux-gnu x86_64-pc-windows-msvc powerpc64-unknown-linux-gnu; do
            make check-platform-build PLATFORM_TARGET="$target"
          done

  parity:
    name: Thorough / Exact parity
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    # The committed native fixture contract is generated on Apple ARM64.
    # Keep the exact C oracle and Rust comparison on the same host family;
    # Linux FreeType can select a different glyph-cache representation.
    runs-on: macos-14
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install prerequisites
        run: |
          for formula in cmake jq xz; do
            if ! brew list --formula "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done
          command -v clang
          command -v make
          command -v python3
          command -v xz
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Prefetch locked dependencies
        run: cargo fetch --locked
      - name: Run exact parity with bounded workers
        shell: bash
        run: |
          set -o pipefail
          log_file="target/ci-diagnostics/fontdone-parity.log"
          mkdir -p "$(dirname "$log_file")"
          set +e
          FONTDONE_UNIFIED_WORKERS=4 make test-parity 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 40 "$log_file" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=exact parity failure::$summary"
            exit "$status"
          fi
      - name: Retain parity diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: parity-diagnostics
          path: |
            target/api-abi-audit/
            target/parity-evidence/
            tests/fixtures/outputs/
          if-no-files-found: ignore
          retention-days: 14

  integrations:
    name: Thorough / Rust, C, raw WASM, and npm consumers
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Prefetch locked dependencies
        run: cargo fetch --locked
      - name: Install pinned Node and npm
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Record host tools
        run: |
          cc --version
          node --version
      - run: make test-integrations

  commit-gate:
    name: Commit gate
    if: always()
    needs: [commit-fast, msrv, portable-abi]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every commit check
        env:
          COMMIT_FAST: ${{ needs.commit-fast.result }}
          MSRV: ${{ needs.msrv.result }}
          PORTABLE_ABI: ${{ needs.portable-abi.result }}
        run: |
          printf '%s\n' \
            "commit-fast=$COMMIT_FAST" \
            "msrv=$MSRV" \
            "portable-abi=$PORTABLE_ABI"
          for result in \
            "$COMMIT_FAST" "$MSRV" "$PORTABLE_ABI"
          do
            test "$result" = "success"
          done

  coverage:
    name: Thorough / All-lane coverage
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: commit-gate
    # Use the same Apple ARM64 oracle contract as the full parity job.
    # Linux's uninitialized FTC missing-bitmap fields are not portable oracle
    # values; all maintained cases still run on the canonical host.
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_COVERAGE_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install coverage prerequisites
        run: |
          for formula in cmake jq xz; do
            if ! brew list --formula "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$RUST_COVERAGE_TOOLCHAIN" \
            --profile minimal --component llvm-tools-preview
          rustup override set "$RUST_TOOLCHAIN"
          make setup-coverage-tools
      - name: Prefetch locked dependencies
        run: cargo fetch --locked
      - name: Measure every maintained runtime lane
        shell: bash
        run: |
          set -o pipefail
          log_file="target/ci-diagnostics/fontdone-coverage.log"
          mkdir -p "$(dirname "$log_file")"
          set +e
          COVERAGE_PREPARE_OPTIONAL_FEATURES=1 \
          COVERAGE_UNIFIED_SHARDS=1 \
          COVERAGE_UNIFIED_WORKERS=1 \
          make test-coverage-all COVERAGE_TOOLCHAIN="$RUST_COVERAGE_TOOLCHAIN" 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 40 "$log_file" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=all-lane coverage failure::$summary"
            exit "$status"
          fi
      - name: Print exact coverage totals
        run: |
          jq '.data[0].totals | {
            lines,
            branches,
            functions,
            regions
          }' target/coverage/unified-runtime-all-lanes.json
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: all-lane-coverage
          path: |
            target/coverage/unified-runtime-all-lanes.json
            target/ci-diagnostics/fontdone-coverage.log
          if-no-files-found: error
          retention-days: 30

  performance:
    name: Thorough / FreeType performance baseline
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: commit-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install benchmark prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake clang make python3 xz-utils
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Record ten-sample C-vs-Rust baseline
        run: make bench BENCH_SAMPLES=10 BENCH_PROFILE=default
      - name: Retain raw samples and report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: performance-baseline
          path: target/fontdone-bench/
          if-no-files-found: error
          retention-days: 30

  native-consumer:
    name: Thorough / Native C / ${{ matrix.marker }}
    # Exercise real linking and execution on main before creating a release tag.
    if: github.event_name != 'pull_request'
    needs: commit-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            marker: contract-linux-x86_64
          - runner: macos-15
            marker: contract-macos-aarch64
          - runner: windows-2025
            marker: contract-windows-x86_64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Record native contract tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          rustc -vV
          cc --version
          nm --version
      - name: Prefetch locked dependencies
        run: cargo fetch --locked
      - name: Verify Unix native contract
        if: runner.os != 'Windows'
        run: make platform-contract
      - name: Verify Windows native contract and import library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio C++ tools were not found" }
          $commandFile = Join-Path $env:RUNNER_TEMP "fontdone-contract.cmd"
          @(
            '@echo off',
            "call `"$installation\VC\Auxiliary\Build\vcvars64.bat`"",
            'if errorlevel 1 exit /b %errorlevel%',
            'make platform-contract PYTHON=python'
          ) | Set-Content -Encoding ascii $commandFile
          New-Item -ItemType Directory -Force target/ci-diagnostics | Out-Null
          $logFile = 'target/ci-diagnostics/windows-contract.log'
          & cmd.exe /d /c $commandFile 2>&1 | Tee-Object -FilePath $logFile
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $summary = (Get-Content $logFile -Tail 50) -join ' '
            $summary = $summary.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows contract failure::$summary"
            exit $status
          }
      - name: Retain native contract evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-contract-${{ matrix.marker }}
          path: |
            target/api-abi-audit/platform-contract/*.json
            target/ci-diagnostics/windows-contract.log
          if-no-files-found: error
          retention-days: 30

  cross-consumer:
    name: Thorough / Cross C / ${{ matrix.marker }}
    if: github.event_name != 'pull_request'
    needs: commit-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - marker: contract-linux-i686
            target: i686-unknown-linux-gnu
            packages: gcc-i686-linux-gnu libc6-dev-i386-cross qemu-user
            cc: i686-linux-gnu-gcc
            nm: i686-linux-gnu-nm
            runner: qemu-i386 -L /usr/i686-linux-gnu
            sysroot: /usr/i686-linux-gnu
          - marker: contract-linux-powerpc64
            target: powerpc64-unknown-linux-gnu
            packages: gcc-powerpc64-linux-gnu libc6-dev-ppc64-cross qemu-user
            cc: powerpc64-linux-gnu-gcc
            nm: powerpc64-linux-gnu-nm
            runner: qemu-ppc64 -L /usr/powerpc64-linux-gnu
            sysroot: /usr/powerpc64-linux-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.target }}"
      - name: Install cross C compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.packages }}
      - name: Record cross contract tools
        shell: bash
        run: |
          set -euxo pipefail
          rustc -vV
          "${{ matrix.cc }}" --version
          "${{ matrix.nm }}" --version
          runner_command='${{ matrix.runner }}'
          runner_bin="${runner_command%% *}"
          "$runner_bin" --version
          test -d "${{ matrix.sysroot }}"
          # sed consumes the complete stream, avoiding SIGPIPE under pipefail.
          find "${{ matrix.sysroot }}" -maxdepth 2 -type f | sed -n '1,20p'
      - name: Prefetch locked dependencies
        run: cargo fetch --locked
      - name: Execute cross-platform contract
        shell: bash
        run: |
          set -o pipefail
          log_file="target/ci-diagnostics/platform-contract-${{ matrix.marker }}.log"
          mkdir -p "$(dirname "$log_file")"
          set +e
          CARGO_BUILD_JOBS=2 make platform-contract-cross \
            PLATFORM_TARGET="${{ matrix.target }}" \
            PLATFORM_CC="${{ matrix.cc }}" \
            PLATFORM_NM="${{ matrix.nm }}" \
            PLATFORM_RUNNER="${{ matrix.runner }}" \
            PLATFORM_SYSROOT="${{ matrix.sysroot }}" 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 40 "$log_file" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=cross contract failure::$summary"
            exit "$status"
          fi
      - name: Retain cross contract evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-contract-${{ matrix.marker }}
          path: |
            target/api-abi-audit/platform-contract/*.json
            target/ci-diagnostics/platform-contract-${{ matrix.marker }}.log
          if-no-files-found: error
          retention-days: 30

  platform-contract-scorecard:
    name: Thorough / Five-platform C scorecard
    if: github.event_name != 'pull_request'
    needs: [native-consumer, cross-consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install contract prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake clang make python3 xz-utils
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Assemble platform bundles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: platform-contract-*
          # Each archive contains both bundle JSON and diagnostics, so its
          # common upload root is target/. Restore that original layout.
          path: target
          merge-multiple: true
      - name: Validate evidence and report current contract debt
        shell: bash
        run: |
          set -o pipefail
          log_file="target/api-abi-audit/platform-scorecard.log"
          mkdir -p "$(dirname "$log_file")"
          set +e
          make c-abi-contract-all-platforms 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 60 "$log_file" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=platform scorecard failure::$summary"
            exit "$status"
          fi
      - name: Explain external C comparison failures
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def annotate(title, value):
              message = json.dumps(value, ensure_ascii=True, separators=(",", ":"))
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{message}")

          def differences(expected, actual, path="$", limit=10):
              if type(expected) is not type(actual):
                  return [{"path": path, "expected": expected, "actual": actual}]
              if isinstance(expected, dict):
                  rows = []
                  for key in sorted(expected.keys() | actual.keys()):
                      rows.extend(differences(expected.get(key), actual.get(key), f"{path}.{key}"))
                      if len(rows) >= limit:
                          break
                  return rows[:limit]
              if expected != actual:
                  return [{"path": path, "expected": expected, "actual": actual}]
              return []

          path = Path("target/api-abi-audit/external_c_function_ledger.json")
          if path.is_file():
              ledger = json.loads(path.read_text())
              annotate("external C totals", ledger["totals"])
              annotate("external C unverified functions", {
                  name: row for name, row in ledger["functions"].items()
                  if row["status"] != "verified"
              })
              failed = [row for row in ledger["cases"] if row["status"] != "exact"]
              annotate("external C failed cases", [row["case_id"] for row in failed])
              for row in failed[:5]:
                  annotate("external C first differences", {
                      "case_id": row["case_id"], "status": row["status"],
                      "differences": differences(row.get("pinned"), row.get("external")),
                      "error": row.get("error"),
                  })
          PY
      - name: Retain complete C-contract evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: c-contract-scorecard
          path: target/api-abi-audit/
          if-no-files-found: error
          retention-days: 30

  packages:
    name: Thorough / Cargo and npm archives
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: commit-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Install pinned Node and npm
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - run: make package-verify npm-package-verify
      - name: Retain inspected packages
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: package-archives
          path: |
            target/package/*.crate
            target/npm-package/*.tgz
            target/release-evidence/release-notes.md
            target/release-evidence/*.json
            target/release-evidence/*.sha256
            target/release-evidence/*.txt
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    name: Thorough / Supply chain
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: commit-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-audit-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust and pinned audit tools
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          make setup-tools
      - run: make supply-chain

  thorough-gate:
    name: Thorough gate
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs:
      - commit-gate
      - parity
      - integrations
      - coverage
      - performance
      - platform-contract-scorecard
      - packages
      - supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every requested thorough check
        env:
          COMMIT_GATE: ${{ needs.commit-gate.result }}
          PARITY: ${{ needs.parity.result }}
          INTEGRATIONS: ${{ needs.integrations.result }}
          COVERAGE: ${{ needs.coverage.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          PLATFORM_CONTRACT: ${{ needs.platform-contract-scorecard.result }}
          PACKAGES: ${{ needs.packages.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
        run: |
          printf '%s\n' \
            "commit-gate=$COMMIT_GATE" \
            "parity=$PARITY" \
            "integrations=$INTEGRATIONS" \
            "coverage=$COVERAGE" \
            "performance=$PERFORMANCE" \
            "platform-contract=$PLATFORM_CONTRACT" \
            "packages=$PACKAGES" \
            "supply-chain=$SUPPLY_CHAIN"
          for result in \
            "$COMMIT_GATE" "$PARITY" "$INTEGRATIONS" "$COVERAGE" "$PERFORMANCE" \
            "$PLATFORM_CONTRACT" "$PACKAGES" "$SUPPLY_CHAIN"
          do
            test "$result" = "success"
          done
