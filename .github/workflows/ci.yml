name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.96.1"
  RUST_MSRV: "1.87.0"
  RUST_COVERAGE_TOOLCHAIN: "nightly-2026-07-16"
  CARGO_LLVM_COV_VERSION: "0.8.7"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  rust-quality:
    name: Commit / Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal --component clippy,rustfmt
          rustup override set "$RUST_TOOLCHAIN"
      - name: Format and Clippy
        run: make lint
      - name: Workspace tests
        run: make test-fast
      - name: Strict docs and public Rust examples
        run: |
          make doc
          make doc-test
          make test-rust-consumer
      - name: Benchmark harness contract
        run: make bench-self-test

  msrv:
    name: Commit / MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_MSRV }}-${{ hashFiles('Cargo.lock') }}
      - name: Install MSRV
        run: |
          rustup toolchain install "$RUST_MSRV" --profile minimal
          rustup override set "$RUST_MSRV"
      - run: make test-fast

  contracts:
    name: Commit / Generated and documented contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Install pinned font-generation tools
        run: |
          python3 -m venv target/font-generation-venv
          target/font-generation-venv/bin/python -m pip install \
            --requirement requirements-font-generation.txt
      - name: Reject generated contract drift
        run: make check-generated
      - name: Reject generated fixture drift
        run: make check-font-fixtures PYTHON=target/font-generation-venv/bin/python
      - name: Validate documentation and synchronized versions
        run: |
          make check-docs
          make check-versions

  abi-smoke:
    name: Commit / Runtime and ABI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install oracle build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake clang make python3 xz-utils
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Run representative exact runtime lanes
        run: make test-parity-smoke
      - name: Retain smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-smoke-diagnostics
          path: |
            target/api-abi-audit/
            tests/fixtures/outputs/
          if-no-files-found: ignore
          retention-days: 7

  parity:
    name: Thorough / Exact parity
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake clang make python3 xz-utils
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - run: make test-parity
      - name: Retain parity diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-diagnostics
          path: |
            target/api-abi-audit/
            target/parity-evidence/
            tests/fixtures/outputs/
          if-no-files-found: ignore
          retention-days: 14

  integrations:
    name: Thorough / Rust, C, and WASM consumers
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Install Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Record host tools
        run: |
          cc --version
          node --version
      - run: make test-integrations

  commit-gate:
    name: Commit gate
    if: always()
    needs: [rust-quality, msrv, contracts, abi-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every commit check
        env:
          RUST_QUALITY: ${{ needs.rust-quality.result }}
          MSRV: ${{ needs.msrv.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          ABI_SMOKE: ${{ needs.abi-smoke.result }}
        run: |
          printf '%s\n' \
            "rust-quality=$RUST_QUALITY" \
            "msrv=$MSRV" \
            "contracts=$CONTRACTS" \
            "abi-smoke=$ABI_SMOKE"
          for result in \
            "$RUST_QUALITY" "$MSRV" "$CONTRACTS" "$ABI_SMOKE"
          do
            test "$result" = "success"
          done

  coverage:
    name: Thorough / All-lane coverage
    if: github.event_name == 'workflow_dispatch'
    needs: commit-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_COVERAGE_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install coverage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake clang jq make python3 xz-utils
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$RUST_COVERAGE_TOOLCHAIN" \
            --profile minimal --component llvm-tools-preview
          rustup override set "$RUST_TOOLCHAIN"
          make setup-coverage-tools
      - name: Measure every maintained runtime lane
        run: make test-coverage-all COVERAGE_TOOLCHAIN="$RUST_COVERAGE_TOOLCHAIN"
      - name: Print exact coverage totals
        run: |
          jq '.data[0].totals | {
            lines,
            branches,
            functions,
            regions
          }' target/coverage/unified-runtime-all-lanes.json
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: all-lane-coverage
          path: target/coverage/unified-runtime-all-lanes.json
          if-no-files-found: error
          retention-days: 30

  performance:
    name: Thorough / FreeType performance baseline
    if: github.event_name == 'workflow_dispatch'
    needs: commit-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install benchmark prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake clang make python3 xz-utils
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Record ten-sample C-vs-Rust baseline
        run: make bench BENCH_SAMPLES=10 BENCH_PROFILE=default
      - name: Retain raw samples and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-baseline
          path: target/fontdone-bench/
          if-no-files-found: error
          retention-days: 30

  native-consumer:
    name: Thorough / Native C / ${{ matrix.marker }}
    if: github.event_name == 'workflow_dispatch'
    needs: commit-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            marker: contract-linux-x86_64
          - runner: macos-15
            marker: contract-macos-aarch64
          - runner: windows-2025
            marker: contract-windows-x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Verify Unix native contract
        if: runner.os != 'Windows'
        run: make platform-contract
      - name: Verify Windows native contract and import library
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          make platform-contract PYTHON=python
      - name: Retain native contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-contract-${{ matrix.marker }}
          path: target/api-abi-audit/platform-contract/*.json
          if-no-files-found: error
          retention-days: 30

  cross-consumer:
    name: Thorough / Cross C / ${{ matrix.marker }}
    if: github.event_name == 'workflow_dispatch'
    needs: commit-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - marker: contract-linux-i686
            target: i686-unknown-linux-gnu
            packages: gcc-i686-linux-gnu libc6-dev-i386-cross qemu-user
            cc: i686-linux-gnu-gcc
            nm: i686-linux-gnu-nm
            runner: qemu-i386 -L /usr/i686-linux-gnu
            sysroot: /usr/i686-linux-gnu
          - marker: contract-linux-powerpc64
            target: powerpc64-unknown-linux-gnu
            packages: gcc-powerpc64-linux-gnu libc6-dev-ppc64-cross qemu-user
            cc: powerpc64-linux-gnu-gcc
            nm: powerpc64-linux-gnu-nm
            runner: qemu-ppc64 -L /usr/powerpc64-linux-gnu
            sysroot: /usr/powerpc64-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.target }}"
      - name: Install cross C compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.packages }}
      - name: Execute cross-platform contract
        run: |
          make platform-contract-cross \
            PLATFORM_TARGET="${{ matrix.target }}" \
            PLATFORM_CC="${{ matrix.cc }}" \
            PLATFORM_NM="${{ matrix.nm }}" \
            PLATFORM_RUNNER="${{ matrix.runner }}" \
            PLATFORM_SYSROOT="${{ matrix.sysroot }}"
      - name: Retain cross contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-contract-${{ matrix.marker }}
          path: target/api-abi-audit/platform-contract/*.json
          if-no-files-found: error
          retention-days: 30

  platform-contract-scorecard:
    name: Thorough / Five-platform C scorecard
    if: github.event_name == 'workflow_dispatch'
    needs: [native-consumer, cross-consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install contract prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake clang make python3 xz-utils
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Assemble platform bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: platform-contract-*
          path: target/api-abi-audit/platform-contract
          merge-multiple: true
      - name: Validate evidence and report current contract debt
        run: make c-abi-contract-all-platforms
      - name: Retain complete C-contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c-contract-scorecard
          path: target/api-abi-audit/
          if-no-files-found: error
          retention-days: 30

  packages:
    name: Thorough / Package archives
    if: github.event_name == 'workflow_dispatch'
    needs: commit-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - run: make package-verify
      - name: Retain inspected packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-archives
          path: |
            target/package/*.crate
            target/release-evidence/*.json
            target/release-evidence/*.txt
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    name: Thorough / Supply chain
    if: github.event_name == 'workflow_dispatch'
    needs: commit-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-audit-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust and pinned audit tools
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          make setup-tools
      - run: make supply-chain

  thorough-gate:
    name: Thorough gate
    if: always() && github.event_name == 'workflow_dispatch'
    needs:
      - commit-gate
      - parity
      - integrations
      - coverage
      - performance
      - platform-contract-scorecard
      - packages
      - supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every requested thorough check
        env:
          COMMIT_GATE: ${{ needs.commit-gate.result }}
          PARITY: ${{ needs.parity.result }}
          INTEGRATIONS: ${{ needs.integrations.result }}
          COVERAGE: ${{ needs.coverage.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          PLATFORM_CONTRACT: ${{ needs.platform-contract-scorecard.result }}
          PACKAGES: ${{ needs.packages.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
        run: |
          printf '%s\n' \
            "commit-gate=$COMMIT_GATE" \
            "parity=$PARITY" \
            "integrations=$INTEGRATIONS" \
            "coverage=$COVERAGE" \
            "performance=$PERFORMANCE" \
            "platform-contract=$PLATFORM_CONTRACT" \
            "packages=$PACKAGES" \
            "supply-chain=$SUPPLY_CHAIN"
          for result in \
            "$COMMIT_GATE" "$PARITY" "$INTEGRATIONS" "$COVERAGE" "$PERFORMANCE" \
            "$PLATFORM_CONTRACT" "$PACKAGES" "$SUPPLY_CHAIN"
          do
            test "$result" = "success"
          done
