[workspace]
members = ["fontdone-c-abi", "fontdone-wasm"]
resolver = "3"

[package]
name = "fontdone"
version = "2.14.3-alpha.1"
edition = "2024"
rust-version = "1.87"
license = "FTL"
publish = ["crates-io"]
description = "Pure-Rust font engine measured for behavioral parity with FreeType 2.14.3"
readme = "README.md"
repository = "https://github.com/appunni-m/fontdone"
keywords = ["freetype", "truetype", "font", "rendering", "autohint"]
categories = ["rendering", "text-processing"]
include = [
    "/src/**",
    "/examples/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/FTL.TXT",
    "/NOTICE.md",
]

[lib]
name = "fontdone"

[dependencies]
bzip2-rs = { version = "0.1.2", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
log = "0.4"
thiserror = "2"

[dev-dependencies]
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
# Path-only dev dependencies avoid a publish-time dependency cycle: the
# independently published facades require this root crate and are not runtime
# dependencies of `fontdone`.
fontdone-c-abi = { path = "fontdone-c-abi", features = ["abi-test-support"] }
fontdone-wasm = { path = "fontdone-wasm", features = ["abi-test-support"] }

[features]
default = ["bzip2", "color-layers", "lzw"]
abi-test-support = []
bzip2 = ["dep:bzip2-rs"]
color-layers = []
lzw = []
subpixel-rendering = []
# Preserve LP64-width FreeType arithmetic for wasm consumers. Native targets
# continue to use their platform C data-model aliases.
wasm-wide-internals = []

[lints.rust]
future-incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage, coverage_nightly)'] }
unsafe_code = "deny"
unused_crate_dependencies = "warn"
dead_code = "deny"
deprecated = "allow"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
todo = "deny"
redundant_clone = "deny"
large_enum_variant = "deny"
needless_collect = "deny"
clone_on_copy = "deny"
unnecessary_to_owned = "deny"
needless_borrow = "deny"
map_unwrap_or = "deny"
needless_range_loop = "deny"
unnecessary_cast = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
arithmetic_side_effects = "warn"
